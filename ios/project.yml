name: Drunk
options:
  bundleIdPrefix: com.allain
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
  groupSortPosition: top
  createIntermediateGroups: true

targets:
  Drunk:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Drunk
        CFBundleDisplayName: Drunk
        CFBundleIdentifier: com.allain.drunk
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)

        # Scènes (obligatoire pour SceneDelegate)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate

        # Orientation
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        # Écran de lancement vide
        UILaunchScreen:
          UIColorName: ""

        # Permissions (géolocalisation utilisée par le site)
        NSLocationWhenInUseUsageDescription: "Pour afficher ta position sur la carte des potes."

        # Chiffrement — obligatoire pour le App Store
        ITSAppUsesNonExemptEncryption: false

        # WebView : autorise le contenu actif
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            drunk-weld.vercel.app:
              NSExceptionAllowsInsecureHTTPLoads: false
              NSIncludesSubdomains: true
            drunk-l34t.onrender.com:
              NSExceptionAllowsInsecureHTTPLoads: false
              NSIncludesSubdomains: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allain.drunk
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"         # iPhone seulement
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        ENABLE_BITCODE: false
        SWIFT_COMPILATION_MODE: wholemodule
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          PROVISIONING_PROFILE_SPECIFIER: $(PROV_PROFILE)
        Debug:
          CODE_SIGN_STYLE: Automatic
